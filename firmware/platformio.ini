; Ghim đúng phiên bản đã build thử thành công ngày 2026-11-25 để máy nào build cũng ra cùng một firmware.
; Không ghim thì PlatformIO tự lấy bản mới nhất, ví dụ espressif32 đã nhảy từ 6.x (Arduino-ESP32 2.x)
; lên 8.x (Arduino-ESP32 3.x) và có thể đổi API.
; espressif32 8.0.0 = Arduino-ESP32 3.3.12
[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Trạm bị lỗi khởi động lại thì Serial Monitor in luôn tên hàm và dòng code gây lỗi
monitor_filters = esp32_exception_decoder

; GFX và BusIO đứng trước SSD1306: nếu không, SSD1306 tự kéo thêm GFX bản mới nhất (2.x), máy có 2 bản GFX cùng lúc
lib_deps =
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 6.21.6
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit GFX Library @ 1.13.0
    adafruit/Adafruit SSD1306 @ 2.5.17
