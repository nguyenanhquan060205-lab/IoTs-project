<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Hình 3.3: Lưu đồ khởi động và vòng lặp của firmware</title>
<style>html,body{margin:0;background:#ffffff} svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1230" viewBox="0 0 1100 1230"
     font-family="'Segoe UI', Arial, sans-serif" role="img" aria-label="Hình 3.3: Lưu đồ khởi động và vòng lặp của firmware">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="210" y="24" font-size="16" font-weight="bold" text-anchor="middle" fill="#555555">setup(): chạy một lần</text>
<text x="640" y="24" font-size="16" font-weight="bold" text-anchor="middle" fill="#555555">loop(): lặp liên tục</text>
<rect x="30" y="40" width="360" height="56" rx="28" fill="#eaf1fb" stroke="#222222" stroke-width="1.6"/>
<text x="210.0" y="73.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Cấp nguồn, chạy setup()</text>
<path d="M 210,96 L 210,120" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30" y="122" width="360" height="60" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="210.0" y="157.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Khởi tạo Serial, chân LED, còi PWM</text>
<path d="M 210,182 L 210,206" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30" y="208" width="360" height="60" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="210.0" y="243.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Đọc NVS: loại đất, mốc khô / ướt</text>
<path d="M 210,268 L 210,292" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30" y="294" width="360" height="70" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="210.0" y="322.5" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Khởi động OLED</text>
<text x="210.0" y="345.5" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">(không thấy thì bỏ qua)</text>
<path d="M 210,364 L 210,388" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30" y="390" width="360" height="70" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="210.0" y="418.5" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Kết nối WiFi (WiFiMulti)</text>
<text x="210.0" y="441.5" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">thử tối đa 2 lần, khoảng 25 giây</text>
<path d="M 210,460 L 210,484" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30" y="486" width="360" height="94" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="210.0" y="515.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">configTzTime(&quot;ICT-7&quot;, pool.ntp.org,</text>
<text x="210.0" y="538.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">time.google.com): SNTP chạy nền,</text>
<text x="210.0" y="561.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">tự đồng bộ lại mỗi giờ</text>
<path d="M 210,580 L 210,604" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30" y="606" width="360" height="70" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="210.0" y="634.5" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Nạp Root CA, chờ bắt tay TLS 10 giây,</text>
<text x="210.0" y="657.5" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">bộ đệm MQTT 768 byte</text>
<path d="M 210,676 L 210,700" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30" y="702" width="360" height="56" rx="28" fill="#eaf1fb" stroke="#222222" stroke-width="1.6"/>
<text x="210.0" y="735.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Sang loop()</text>
<path d="M 390,730 L 428,730" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="450" y="40" width="380" height="56" rx="28" fill="#eaf1fb" stroke="#222222" stroke-width="1.6"/>
<text x="640.0" y="73.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Đầu vòng loop()</text>
<path d="M 640,96 L 640,118" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="640,120.0 770.0,168 640,216.0 510.0,168" fill="#fffbea" stroke="#222222" stroke-width="1.6"/>
<text x="640" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Có WiFi?</text>
<path d="M 770,168 L 858,168" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="790" y="160" font-size="15" font-weight="normal" text-anchor="start" fill="#555555" stroke="#ffffff" stroke-width="5" paint-order="stroke">Không</text>
<rect x="860" y="134" width="220" height="68" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="970.0" y="161.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">Cứ 15 giây</text>
<text x="970.0" y="183.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">dò lại WiFi 1 lần</text>
<path d="M 1080,168 L 1090,168 L 1090,520 L 762,520" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 640,216 L 640,246" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="650" y="236" font-size="15" font-weight="normal" text-anchor="start" fill="#555555" stroke="#ffffff" stroke-width="5" paint-order="stroke">Có</text>
<polygon points="640,248.0 770.0,296 640,344.0 510.0,296" fill="#fffbea" stroke="#222222" stroke-width="1.6"/>
<text x="640" y="301" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Đã nối broker?</text>
<path d="M 770,296 L 858,296" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="790" y="288" font-size="15" font-weight="normal" text-anchor="start" fill="#555555" stroke="#ffffff" stroke-width="5" paint-order="stroke">Không</text>
<rect x="860" y="252" width="220" height="92" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="970.0" y="280.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">Cứ 5 giây: connect</text>
<text x="970.0" y="302.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">TLS cổng 8883,</text>
<text x="970.0" y="324.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">kèm LWT offline</text>
<path d="M 970,344 L 970,364" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="860" y="366" width="220" height="72" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="970.0" y="395.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">Đăng ký command,</text>
<text x="970.0" y="417.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">gửi online (giữ lại)</text>
<path d="M 860,402 L 832,402" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 640,344 L 640,370" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="650" y="362" font-size="15" font-weight="normal" text-anchor="start" fill="#555555" stroke="#ffffff" stroke-width="5" paint-order="stroke">Có</text>
<rect x="450" y="372" width="380" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="640.0" y="406.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">mqtt.loop(); cứ 30 giây gửi lại online</text>
<path d="M 640,432 L 640,470" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="640,472.0 770.0,520 640,568.0 510.0,520" fill="#fffbea" stroke="#222222" stroke-width="1.6"/>
<text x="640" y="525" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Đủ 4 giây?</text>
<path d="M 510,520 L 430,520 L 430,68 L 448,68" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="500" y="510" font-size="15" font-weight="normal" text-anchor="end" fill="#555555" stroke="#ffffff" stroke-width="5" paint-order="stroke">Không</text>
<path d="M 640,568 L 640,598" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="650" y="590" font-size="15" font-weight="normal" text-anchor="start" fill="#555555" stroke="#ffffff" stroke-width="5" paint-order="stroke">Có</text>
<rect x="450" y="600" width="380" height="70" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="640.0" y="628.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">Đọc 21 mẫu ADC (3 ms/mẫu),</text>
<text x="640.0" y="650.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">lọc cắt tỉa: bỏ 5 thấp nhất, 5 cao nhất</text>
<path d="M 640,670 L 640,694" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="450" y="696" width="380" height="70" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="640.0" y="724.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">Độ ẩm → EC → N, P, K, pH theo loại đất,</text>
<text x="640.0" y="746.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">so N, P, K với mức chuẩn</text>
<path d="M 640,766 L 640,790" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="450" y="792" width="380" height="56" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="640.0" y="824.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">Bật đèn, cập nhật OLED, in Serial</text>
<path d="M 640,848 L 640,872" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="640,872.0 770.0,920 640,968.0 510.0,920" fill="#fffbea" stroke="#222222" stroke-width="1.6"/>
<text x="640" y="925" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Đang nối broker?</text>
<path d="M 640,968 L 640,994" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="650" y="986" font-size="15" font-weight="normal" text-anchor="start" fill="#555555" stroke="#ffffff" stroke-width="5" paint-order="stroke">Có</text>
<rect x="450" y="996" width="380" height="70" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="640.0" y="1024.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">Gửi telemetry, thêm timestamp</text>
<text x="640.0" y="1046.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">nếu đã có giờ NTP</text>
<path d="M 770,920 L 870,920 L 870,1114 L 832,1114" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="790" y="912" font-size="15" font-weight="normal" text-anchor="start" fill="#555555" stroke="#ffffff" stroke-width="5" paint-order="stroke">Không</text>
<path d="M 640,1066 L 640,1084" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="450" y="1086" width="380" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="640.0" y="1109.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">Còi 3 tiếng nếu độ ẩm vừa ra</text>
<text x="640.0" y="1131.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#222222">ngoài khoảng 35 – 80%</text>
<path d="M 640,1146 L 640,1174 L 430,1174 L 430,520" fill="none" stroke="#222222" stroke-width="1.6"/>
</svg>
</body></html>
