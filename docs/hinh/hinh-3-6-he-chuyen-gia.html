<!DOCTYPE html>

<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">

<text x="110.0" y="345.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">EC, độ ẩm</text>

<text x="254" y="52" font-size="17" font-weight="bold" text-anchor="start" fill="#222222">1. Đối chiếu ngưỡng chuẩn</text>
<text x="646" y="52" font-size="15" font-weight="normal" text-anchor="end" fill="#555555">điểm trừ</text>

<text x="646" y="146" font-size="16" font-weight="bold" text-anchor="end" fill="#222222">−15</text>
<line x1="254" y1="162" x2="646" y2="162" stroke="#dddddd" stroke-width="1"/>

<text x="254" y="284" font-size="16" font-weight="normal" text-anchor="start" fill="#222222">N &lt; 50 mg/kg: thiếu đạm</text>

<text x="254" y="330" font-size="16" font-weight="normal" text-anchor="start" fill="#222222">N &gt; 150 mg/kg: dư đạm</text>

<text x="254" y="514" font-size="16" font-weight="normal" text-anchor="start" fill="#222222">Độ ẩm &gt; 80%: ngập úng</text>

<text x="254" y="590" font-size="15" font-weight="normal" text-anchor="start" fill="#555555">Một bộ ngưỡng chung cho mọi loại đất</text>

<text x="1000.0" y="222.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#222222">3. Kết luận</text>
<text x="1000.0" y="245.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">≥ 80: tốt</text>
<text x="1000.0" y="268.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">50 – 79:</text>
<text x="1000.0" y="291.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">trung bình</text>

<text x="1000.0" y="337.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222"></text>
<text x="1000.0" y="360.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">Danh sách</text>

<text x="1000.0" y="406.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">phân bón cần</text>
<text x="1000.0" y="429.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#222222">bổ sung</text>
